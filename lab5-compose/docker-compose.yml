services:
  web:
    image: nginx:alpine
    ports:
      - "8082:80"
    networks:
      - appnet
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:

volumes:
  pgdata:
